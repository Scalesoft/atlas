# A local or self-hosting example: `docker compose up -d`, then http://localhost:8080 (README, "Rychlý start").
# The passwords below are placeholders. Before the installation holds anything real, set your own in .env next to this file
# (never commit it): ATLAS_DB_OWNER_PASSWORD, ATLAS_DB_APP_PASSWORD; no ';' in either. Pin ATLAS_IMAGE to a released version.
services:
  wiki-db:
    # The official pgvector image (PostgreSQL 19, Debian), pinned by digest. A volume with PostgreSQL 18 data must be upgraded
    # first (deploy/postgres/upgrade.sh; docs/operations.md, "Upgrade na PostgreSQL 19").
    image: ${ATLAS_POSTGRES_IMAGE:-docker.io/pgvector/pgvector:0.8.7-pg19-trixie@sha256:ace863afa68a13560603dc7366fad0adb4f5ddd0a21c8f06418195f32e03fa08}
    restart: unless-stopped
    # Each major keeps its cluster in <major>/docker on the volume. With only another major's cluster there, the image would
    # create an empty one beside it and Atlas would offer a fresh installation: refuse to start instead; the data stay as they are.
    entrypoint:
      - sh
      - -c
      - |
        if [ ! -s "$$PGDATA/PG_VERSION" ]; then
          for old in /var/lib/postgresql/*/docker/PG_VERSION; do
            [ -s "$$old" ] || continue
            echo "wiki-db: $${old%/PG_VERSION} holds PostgreSQL $$(cat "$$old") data and $$PGDATA is empty; upgrade the volume first (deploy/postgres/upgrade.sh, docs/operations.md)." >&2
            exit 1
          done
        fi
        exec docker-entrypoint.sh "$$@"
      - wiki-db
    command: ["postgres"]
    environment:
      # The schema's owner: migrations and the installation restore. An existing volume keeps the password it was created with.
      POSTGRES_USER: wikiuser
      POSTGRES_PASSWORD: ${ATLAS_DB_OWNER_PASSWORD:-change-me-owner}
      POSTGRES_DB: wikidb
      # Text sorts by code point with PostgreSQL's own Unicode tables, as on the former Alpine image and whatever C library the
      # image has; the collation never changes version. Applies when the volume is created (deploy/postgres/upgrade.sh does the same).
      POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
    volumes:
      - wiki-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  atlas:
    image: ${ATLAS_IMAGE:-ghcr.io/scalesoft/atlas:latest}
    restart: unless-stopped
    # Expose a limit to .NET inside nested LXC/Docker; reserve memory for PostgreSQL and the host.
    mem_limit: 1536m
    memswap_limit: 1536m
    depends_on:
      wiki-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_HTTP_PORTS: "8080"
      Authentication__OpenIdConnect__RequireDatabaseAtStartup: "true"
      # Requests, jobs and listeners run as atlas_app, not the superuser: the owner creates it at each start with this password and
      # grants it the rows of the schema, without UPDATE, DELETE or TRUNCATE on audit facts (RuntimeDatabaseRole).
      ConnectionStrings__atlas-db: Host=wiki-db;Port=5432;Database=wikidb;Username=atlas_app;Password=${ATLAS_DB_APP_PASSWORD:-change-me-app}
      ConnectionStrings__atlas-db-owner: Host=wiki-db;Port=5432;Database=wikidb;Username=wikiuser;Password=${ATLAS_DB_OWNER_PASSWORD:-change-me-owner}
    ports:
      # Bind to the reverse proxy's interface (ATLAS_BIND_ADDRESS=127.0.0.1 when the proxy runs on this host); all interfaces by default.
      - "${ATLAS_BIND_ADDRESS:-0.0.0.0}:8080:8080"
    volumes:
      - atlas-data:/data

volumes:
  wiki-db-data:
  atlas-data:
