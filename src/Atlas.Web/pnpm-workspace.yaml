# The editor (Atlas.Markdown) is a package of this workspace; Atlas builds it from source (scripts/build-editor.mjs).
packages:
  - ../Atlas.Markdown
allowBuilds:
  vue-demi: true
patchedDependencies:
  '@tiptap/y-tiptap@3.0.9': patches/@tiptap__y-tiptap@3.0.9.patch
  reka-ui@2.11.0: patches/reka-ui@2.11.0.patch
# Dev-only, under @vue/test-utils -> js-beautify (-> editorconfig): the majors that fix GHSA-3g3m-2fjr-6pw4 (glob < 14.0.2)
# and GHSA-g3hv-75wg-m249 (minimatch < 11.0.1); js-beautify 2.0.3 still asks for glob 13.
overrides:
  glob: ^14.0.2
  minimatch: ^11.0.1
