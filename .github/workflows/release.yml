name: Release

# A push to main is a release: the image ghcr.io/<owner>/atlas:<version> (linux/amd64), the Git tag v<version>
# (version.json) and the GitHub release. The database is the official pgvector image docker-compose.yml pins.
# Nothing is deployed from here; installations pick a released version themselves.
# A commit is tested once: main is develop fast-forwarded, so the release reuses the CI run that passed the same commit on
# its push to develop. Only a commit no such run passed (a hotfix merged into main) runs the CI jobs here.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tested:
    name: CI of this commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.find.outputs.passed }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success&per_page=1" --jq '.total_count')
          if [[ "$passed" -gt 0 ]]; then
            echo "CI passed $GITHUB_SHA on its push to develop; the release reuses it."
            echo 'passed=true' >> "$GITHUB_OUTPUT"
          else
            echo "No passed CI run of $GITHUB_SHA on develop; the release runs the CI jobs."
            echo 'passed=false' >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: tested
    if: needs.tested.outputs.passed != 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Tag and publish
    needs: [tested, ci]
    # Runs after a skipped ci (the commit already passed) and after a passed one, never after a failure.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Check the release version
        id: version
        run: |
          set -euo pipefail
          node tooling/release-version.mjs check version.json v
          version=$(node -p 'require("./version.json").version')
          props=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props | tr -d '\r')
          suffix=$(sed -n 's:.*<VersionSuffix>\(.*\)</VersionSuffix>.*:\1:p' Directory.Build.props | tr -d '\r')
          web=$(node -p 'require("./src/Atlas.Web/package.json").version')
          [[ "$props" == "$version" && "$web" == "$version" && -z "$suffix" ]] \
            || { echo 'main must carry the same stable version in version.json, Directory.Build.props and src/Atlas.Web/package.json.' >&2; exit 1; }
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          { echo "version=$version"; echo "image=ghcr.io/$owner/atlas"; } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Application image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:latest
          build-args: |
            RELEASE_VERSION=${{ steps.version.outputs.version }}
            SOURCE_REVISION=${{ github.sha }}
      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # A rerun of the same commit finds its tag (release-version.mjs refuses a tag on another commit).
          if ! git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            git tag "v$VERSION" "$GITHUB_SHA"
            git push origin "v$VERSION"
          fi
          # The user-facing notes of the version („Co je nového“), in English where they exist.
          notes="src/Atlas.Web/release-notes/$VERSION.en.md"
          [[ -f "$notes" ]] || notes="src/Atlas.Web/release-notes/$VERSION.md"
          gh release view "v$VERSION" > /dev/null 2>&1 || gh release create "v$VERSION" --title "Atlas $VERSION" --notes-file "$notes" --verify-tag
