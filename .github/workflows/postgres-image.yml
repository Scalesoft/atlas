name: Database image

# Publishes ghcr.io/<owner>/atlas-postgres:<tag> (linux/amd64) when deploy/postgres changes on main. The tag is the one
# docker-compose.yml pins, so a change to the Dockerfile comes with a new tag there (bump IMAGE_REVISION).
on:
  push:
    branches: [main]
    paths: ['deploy/postgres/**', 'docker-compose.yml', '.github/workflows/postgres-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Tag pinned in docker-compose.yml
        id: tag
        run: |
          set -euo pipefail
          image=$(grep -o 'ghcr.io/scalesoft/atlas-postgres:[^}]*' docker-compose.yml)
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, verify and publish
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --load -t atlas-postgres-ci --build-arg SOURCE_REVISION=${{ github.sha }} deploy/postgres
          bash deploy/postgres/verify.sh atlas-postgres-ci linux/amd64
          docker tag atlas-postgres-ci "${{ steps.tag.outputs.image }}"
          docker push "${{ steps.tag.outputs.image }}"
