name: CI

# Every pull request into develop or main and every push to develop: the release tooling tests, the editor, the web frontend
# and the server suites. release.yml calls the same jobs on main before it tags and publishes anything.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  public-source:
    name: Public source safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan source, archives, history and commit identities
        run: |
          set -euo pipefail
          scanner="$RUNNER_TEMP/gitleaks"
          sources="$RUNNER_TEMP/public-source"
          mkdir -p "$scanner" "$sources"
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$scanner/download.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scanner/download.tar.gz" | sha256sum -c -
          tar -xzf "$scanner/download.tar.gz" -C "$scanner" gitleaks
          "$scanner/gitleaks" git --config .gitleaks.toml --redact --log-opts=HEAD
          git archive HEAD | tar -x -C "$sources"
          "$scanner/gitleaks" dir "$sources" --config .gitleaks.toml --redact --max-archive-depth 2 --max-decode-depth 2
          git log --format='%ae%n%ce' HEAD | "$scanner/gitleaks" stdin --config .gitleaks.toml --redact

  web:
    name: Editor and web
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Release and tooling rules
        run: node --test tooling/release-version.test.mjs tooling/release-notes.test.mjs tooling/icon-pack/lib.test.mjs
      # The editor (src/Atlas.Markdown) is a package of the frontend workspace: its dist, which Atlas imports, then its own
      # checks and suite, then the frontend.
      - name: Editor and web
        working-directory: src/Atlas.Web
        run: |
          set -euo pipefail
          corepack enable
          corepack install --global "$(node -p "require('./package.json').packageManager")"
          pnpm install --frozen-lockfile
          pnpm run build:editor
          node ../Atlas.Markdown/tests/contracts/architecture.mjs
          node --test ../Atlas.Markdown/tests/package/bundle-budget.test.mjs
          pnpm --filter @atlas/markdown run typecheck
          pnpm run typecheck
          pnpm --filter @atlas/markdown exec vitest --configLoader runner --run
          pnpm test
          pnpm build

  server:
    name: Server
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ATLAS_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=atlas_test;Username=atlas;Password=atlas-ci
      ATLAS_TEST_DATABASE: Host=127.0.0.1;Port=5432;Database=atlas_test;Username=atlas;Password=atlas-ci
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      # The image releases publish (deploy/postgres, the default of docker-compose.yml): PostgreSQL with pgvector on Alpine (musl),
      # which sorts text differently from a glibc image, so the tests run on exactly this build. Migration 2026100520 requires pgvector.
      # Readiness over TCP, not the socket: the image's temporary init server listens on the socket only.
      - name: Start PostgreSQL
        run: |
          set -euo pipefail
          docker build -t atlas-postgres-ci deploy/postgres
          docker run -d --name atlas-test-pg -p 5432:5432 -e POSTGRES_USER=atlas -e POSTGRES_PASSWORD=atlas-ci -e POSTGRES_DB=atlas_test atlas-postgres-ci
          for i in $(seq 1 60); do docker exec atlas-test-pg pg_isready -h 127.0.0.1 -U atlas -d atlas_test && exit 0; sleep 2; done
          docker logs atlas-test-pg; exit 1
      # The PDF tests print with the Chromium headless shell of Playwright 1.64 (as the Dockerfile installs).
      - name: Install the Chromium headless shell for the PDF tests
        run: npx --yes playwright@1.64.1 install --with-deps --only-shell chromium
      - name: Server, Markdown Sync, Yjs and YouTrack tests
        run: bash tooling/ci/server-tests.sh
      - name: Keep the failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/trx
          if-no-files-found: ignore
          retention-days: 14
